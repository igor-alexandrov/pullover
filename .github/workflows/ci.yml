name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./scripts/test.sh
      - run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pullover
          path: dist/Pullover-*.zip
